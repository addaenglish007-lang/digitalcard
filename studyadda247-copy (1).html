function showToast(t){var e=document.getElementById('toast');if(!e)return;e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2400)}
function csIconFallback(el){var p=el&&el.parentElement;if(!p)return;try{el.remove()}catch(e){}p.textContent=p.getAttribute('data-fallback')||'\u2022'}
function fileSafe(n){return String(n||"contact").replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"")||"contact"}
function buildVcf(d){
  var esc=function(x){return String(x==null?"":x).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,")};
  var name=String(d.name||"Business Contact").replace(/[\r\n]+/g," ").trim()||"Business Contact";
  var L=["BEGIN:VCARD","VERSION:3.0","FN:"+esc(name),"N:"+esc(name)+";;;;","ORG:"+esc(name),"X-ABShowAs:COMPANY"];
  if(d.title)L.push("TITLE:"+esc(d.title));
  (d.phones||[]).forEach(function(p,i){var n=String(p).replace(/[^\d+]/g,"");if(n.replace(/\D/g,"").length>=5)L.push("TEL;TYPE=CELL,VOICE"+(i===0?",pref":"")+":"+n)});
  (d.emails||[]).forEach(function(m){L.push("EMAIL;TYPE=INTERNET,WORK:"+String(m).trim())});
  var urls=(d.urls||[]).slice();if(d.pageUrl&&urls.indexOf(d.pageUrl)<0)urls.push(d.pageUrl);
  urls.forEach(function(u){L.push("URL:"+String(u).trim())});
  if(d.address)L.push("ADR;TYPE=WORK:;;"+esc(d.address)+";;;;");
  if(d.note)L.push("NOTE:"+esc(d.note));
  L.push("REV:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""));
  L.push("END:VCARD");
  return L.join("\r\n")+"\r\n";
}
function isIOS(){var n=navigator;return /iPad|iPhone|iPod/.test(n.userAgent)||(n.platform==="MacIntel"&&n.maxTouchPoints>1)}
async function deliverVcf(text,fname){
  var blob=new Blob([text],{type:"text/vcard;charset=utf-8"});
  try{
    var file=new File([blob],fname,{type:"text/vcard"});
    if(isIOS()&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});return "shared"}
  }catch(e){if(e&&e.name==="AbortError")return "cancelled"}
  var url=URL.createObjectURL(blob);
